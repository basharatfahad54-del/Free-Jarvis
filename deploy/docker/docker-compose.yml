# Free Jarvis — local-first stack. Host ports bind to 127.0.0.1 by default.
# Remote access requires BOTH an API key and HTTPS (terminate TLS at a reverse
# proxy in front of these loopback ports); never expose plain HTTP publicly.
services:
  jarvis:
    # Free Jarvis API server (service name kept as `jarvis` for compatibility).
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OPENJARVIS_ENGINE_DEFAULT=ollama
      - OLLAMA_HOST=http://ollama:11434
      # The container binds 0.0.0.0, so an API key is REQUIRED. Compose fails
      # fast if OPENJARVIS_API_KEY is unset (set it in deploy/docker/.env —
      # see .env.example, or `export` it). Generate one: `jarvis auth generate-key`.
      - OPENJARVIS_API_KEY=${OPENJARVIS_API_KEY:?OPENJARVIS_API_KEY must be set (see deploy/docker/.env.example)}
    volumes:
      # Free Jarvis persistent state: config, data, chat history and memory all
      # live under the single default data root (~/.openjarvis in the container).
      - free-jarvis-state:/home/openjarvis/.openjarvis
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    # Local inference provider for Free Jarvis. Pinned to a fixed version +
    # digest for reproducible deployments and predictable rollbacks (#563).
    # Bump deliberately, not implicitly via :latest.
    image: ollama/ollama:0.30.10@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  # Free Jarvis config / data / history / memory are all kept in this volume.
  free-jarvis-state:
  ollama-models:
